name: Cinema Ticketing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cinema_user
          POSTGRES_PASSWORD: cinema_test_password
          POSTGRES_DB: cinema_ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema_user -d cinema_ticketing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cinema_user:cinema_test_password@localhost:5432/cinema_ticketing?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Apply database migrations
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Seed database
        run: node prisma/seed.js

      - name: Run automated tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build Docker image
        run: docker build -t cinema-ticketing-platform:${{ github.sha }} .
